name: Site assistant checks
on:
  push:
    branches: [feature/site-assistant]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAT_ENABLED: 'false'
      CHAT_ALLOWED_ORIGINS: 'http://127.0.0.1:8765'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests/test_chat.py backend/tests/test_mission_chat.py
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.assistant.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-assistant-browser-evidence
          path: test-results/
          retention-days: 7

limit_req_zone $server_name zone=lastlight_api:1m rate=10r/s;
limit_req_zone $server_name zone=lastlight_search:1m rate=6r/m;
limit_conn_zone $server_name zone=lastlight_connections:1m;
limit_req_zone $server_name zone=lastlight_chat:1m rate=8r/m;
server {
 listen 8080 default_server;
 listen [::]:8080 default_server;
 server_name last-light.style.dev;
 server_tokens off;
 client_max_body_size 16k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 send_timeout 30s;
 limit_conn lastlight_connections 30;
 limit_conn_status 429;
 limit_req_status 429;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /api/search {
  limit_req zone=lastlight_search burst=2 nodelay;
  proxy_pass http://127.0.0.1:8000;
  proxy_read_timeout 180s;
 }
 location = /api/chat/prepare {
  limit_req zone=lastlight_chat burst=2 nodelay;
  proxy_pass http://127.0.0.1:8000;
  proxy_read_timeout 25s;
 }
 location = /api/chat {
  limit_req zone=lastlight_chat burst=2 nodelay;
  proxy_pass http://127.0.0.1:8000;
  proxy_read_timeout 25s;
 }
 location /api/ {
  limit_req zone=lastlight_api burst=40 nodelay;
  proxy_pass http://127.0.0.1:8000;
  proxy_read_timeout 180s;
 }
 location / { proxy_pass http://127.0.0.1:8000; }
}

